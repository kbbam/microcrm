name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source data and Python
        run: |
          python -m json.tool data.json >/dev/null
          python -m py_compile build.py research/*.py
      - name: Verify generated artifacts are current
        run: |
          python build.py
          git diff --exit-code -- index.html artifact.html

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: microcrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d microcrm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/microcrm_test
      LOCAL_INSECURE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
